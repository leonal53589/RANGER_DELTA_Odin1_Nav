# 松灵 Ranger Delta + 留形 Odin-1 实车 Nav2 导航参数配置
# (Real-robot Nav2 Configuration for Ranger Delta with Odin-1 PointCloud Obstacle Layer)

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    enable_groot_monitoring: false
    # Keep a valid path until the goal changes or the costmap blocks the path.
    default_nav_to_pose_bt_xml: $(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_w_replanning_only_if_path_becomes_invalid.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15
      allow_unknown: false

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 20.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.12
      movement_time_allowance: 12.0
    goal_checker:
      plugin: odin_nav_sim::SettledGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: false
    FollowPath:
      plugin: odin_nav_sim::DeltaPursuitController
      # Keep the controller's curvature limit in sync with ranger_delta_command.
      minimum_turn_radius: 0.50
      desired_linear_vel: 0.30
      # Match the angular limit of the velocity smoother and chassis.
      max_tracking_angular_speed: 0.30
      max_approach_linear_speed: 0.15
      lookahead_dist: 0.50
      min_approach_linear_velocity: 0.03
      regulated_linear_scaling_min_speed: 0.04
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.50
      rotate_to_heading_angular_vel: 0.30
      max_angular_accel: 1.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      reposition_cloud_topic: /odin1/cloud_raw

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # The measured vehicle radius is at most 0.28 m. The margin is included here.
      robot_radius: 0.30
      footprint_padding: 0.0
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: odin_cloud
        odin_cloud:
          topic: /odin1/cloud_raw
          sensor_frame: lidar
          max_obstacle_height: 1.35
          # Reject near-floor returns using Z in the costmap frame.
          min_obstacle_height: 0.12
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_min_range: 0.20
          raytrace_max_range: 4.5
          obstacle_min_range: 0.20
          obstacle_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.5

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.30
      footprint_padding: 0.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: odin_cloud
        odin_cloud:
          topic: /odin1/cloud_raw
          sensor_frame: lidar
          max_obstacle_height: 1.35
          # Keep the floor cutoff consistent with the global costmap.
          min_obstacle_height: 0.12
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_min_range: 0.20
          raytrace_max_range: 4.5
          obstacle_min_range: 0.20
          obstacle_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 3.5

behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    max_rotational_vel: 0.30
    min_rotational_vel: 0.06
    rotational_acc_lim: 0.60

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.30, 0.0, 0.30]
    min_velocity: [-0.05, 0.0, -0.30]
    max_accel: [0.5, 0.3, 1.0]
    max_decel: [-0.6, -0.4, -1.0]
    velocity_timeout: 0.25

ranger_delta_command:
  ros__parameters:
    max_linear_speed: 0.30
    max_angular_speed: 0.30
    minimum_turn_radius: 0.50
