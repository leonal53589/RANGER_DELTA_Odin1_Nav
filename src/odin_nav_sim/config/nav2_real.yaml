# 松灵 Ranger Delta + 留形 Odin-1 实车 Nav2 导航参数配置
# (Real-robot Nav2 Configuration for Ranger Delta with Odin-1 PointCloud Obstacle Layer)

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    enable_groot_monitoring: false
    default_nav_to_pose_bt_xml: $(find-pkg-share odin_nav_sim)/behavior_trees/navigate_with_obstacle_wait.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share odin_nav_sim)/behavior_trees/navigate_waypoint_segments.xml
    plugin_lib_names:
      - waypoint_segments_bt_node
      - obstacle_navigation_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15
      allow_unknown: false

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 20.0
    # Publish zero on a rejected command and retry across a global costmap update (2 Hz).
    failure_tolerance: 0.6
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.12
      movement_time_allowance: 12.0
    goal_checker:
      plugin: odin_nav_sim::SettledGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: false
    FollowPath:
      plugin: odin_nav_sim::DeltaPursuitController
      tracking_controller: nav2_mppi_controller::MPPIController
      tracking:
        motion_model: Ackermann
        AckermannConstraints:
          min_turning_r: 0.50
        model_dt: 0.05
        time_steps: 56
        batch_size: 1000
        iteration_count: 1
        vx_max: 0.60
        vx_min: 0.0
        wz_max: 0.60
        vx_std: 0.20
        wz_std: 0.24
        # Keep the 1.68 m prediction horizon at full speed within the 4 m local grid.
        prune_distance: 1.9
        visualize: false
        # Final yaw is handled by the chassis' spin mode during terminal parking.
        critics: [ConstraintCritic, CostCritic, GoalCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic]
        CostCritic:
          # Check the actual oriented 54 cm / chamfered chassis footprint instead of a circle.
          consider_footprint: true
        GoalCritic:
          cost_weight: 8.0
          threshold_to_consider: 0.85
        PathAlignCritic:
          cost_weight: 8.0
          offset_from_furthest: 12
          threshold_to_consider: 0.35
        PathFollowCritic:
          threshold_to_consider: 0.85
      # Keep the controller's curvature limit in sync with ranger_delta_command.
      minimum_turn_radius: 0.50
      desired_linear_vel: 0.60
      # Match the angular limit of the velocity smoother and chassis.
      max_tracking_angular_speed: 0.60
      max_approach_linear_speed: 0.15
      lookahead_dist: 0.50
      min_approach_linear_velocity: 0.03
      regulated_linear_scaling_min_speed: 0.04
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.50
      rotate_to_heading_angular_vel: 0.60
      max_angular_accel: 1.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      reposition_cloud_topic: /odin1/cloud_raw
      terminal_settle_hold_time: 0.30
      terminal_settle_timeout: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # Physical chassis is ~0.52 m wide straight and ~0.30 m radius when spinning;
      # keep a 54 cm straight / 30.7 cm spin-circumradius chamfered footprint.
      footprint: '[[0.29, 0.10], [0.14, 0.27], [-0.14, 0.27], [-0.29, 0.10], [-0.29, -0.10], [-0.14, -0.27], [0.14, -0.27], [0.29, -0.10]]'
      footprint_padding: 0.0
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: odin_nav_sim::DecayingVoxelLayer
        enabled: true
        obstacle_persistence: 3.5
        # Keep returns at different heights independent when clearing a column.
        origin_z: -0.01
        z_resolution: 0.20
        z_voxels: 8
        mark_threshold: 0
        observation_sources: odin_cloud clearing_cloud
        odin_cloud:
          topic: /odin1/cloud_raw
          sensor_frame: lidar
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.12
          max_obstacle_height: 1.35
          obstacle_min_range: 0.20
          obstacle_max_range: 3.5
        clearing_cloud:
          topic: /odin1/cloud_raw
          sensor_frame: lidar
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.08
          max_obstacle_height: 1.35
          raytrace_min_range: 0.0
          raytrace_max_range: 4.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.5

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      footprint: '[[0.29, 0.10], [0.14, 0.27], [-0.14, 0.27], [-0.29, 0.10], [-0.29, -0.10], [-0.14, -0.27], [0.14, -0.27], [0.29, -0.10]]'
      footprint_padding: 0.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: odin_nav_sim::DecayingVoxelLayer
        enabled: true
        obstacle_persistence: 3.0
        # Keep returns at different heights independent when clearing a column.
        origin_z: -0.01
        z_resolution: 0.20
        z_voxels: 8
        mark_threshold: 0
        observation_sources: odin_cloud clearing_cloud
        odin_cloud:
          topic: /odin1/cloud_raw
          sensor_frame: lidar
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.12
          max_obstacle_height: 1.35
          obstacle_min_range: 0.20
          obstacle_max_range: 3.5
        clearing_cloud:
          topic: /odin1/cloud_raw
          sensor_frame: lidar
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.08
          max_obstacle_height: 1.35
          raytrace_min_range: 0.0
          raytrace_max_range: 4.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.5

behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    max_rotational_vel: 0.30
    min_rotational_vel: 0.06
    rotational_acc_lim: 0.60

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.60, 0.05, 0.60]
    min_velocity: [-0.05, -0.05, -0.60]
    max_accel: [0.5, 0.3, 1.0]
    max_decel: [-0.6, -0.4, -1.0]
    velocity_timeout: 0.25

ranger_delta_command:
  ros__parameters:
    max_linear_speed: 0.60
    max_angular_speed: 0.60
    minimum_turn_radius: 0.50

navigation_velocity_guard:
  ros__parameters:
    cloud_timeout: 0.45
    odom_timeout: 0.20
    map_timeout: 0.50
    command_timeout: 0.20
    sweep_radius: 0.305
    body_half_width: 0.27
    body_half_length: 0.29
    distance_margin: 0.03
    reaction_time: 0.35
    brake_deceleration: 0.5
    min_height: 0.12
    max_height: 1.35
