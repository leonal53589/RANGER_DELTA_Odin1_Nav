bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15
      allow_unknown: false

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 20.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.13
      yaw_goal_tolerance: 0.12
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.55
      lookahead_dist: 0.55
      min_approach_linear_velocity: 0.06
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.65
      rotate_to_heading_angular_vel: 0.9
      max_angular_accel: 2.0
      use_collision_detection: true

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      footprint: '[[0.28, 0.25], [0.28, -0.25], [-0.28, -0.25], [-0.28, 0.25]]'
      resolution: 0.1
      update_frequency: 2.0
      publish_frequency: 1.0
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 4.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      footprint: '[[0.28, 0.25], [0.28, -0.25], [-0.28, -0.25], [-0.28, 0.25]]'
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.1
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 4.0

behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    feedback: OPEN_LOOP
    max_velocity: [0.55, 0.0, 1.3]
    min_velocity: [-0.25, 0.0, -1.3]
    max_accel: [0.7, 0.0, 2.0]
    max_decel: [-0.9, 0.0, -2.0]
    velocity_timeout: 0.25
